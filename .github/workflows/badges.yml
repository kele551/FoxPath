name: badges

# 每天自动更新「真实下载数（GitHub + GitCode）」与「浏览量（Gitee + GitCode）」的徽章数据，
# README 里两枚徽章用 shields.io endpoint 读 docs/downloads.json / docs/views.json。

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 更新徽章数据
        run: |
          python tools/downloads_badge.py \
            --repo "${{ github.event.repository.name }}" \
            --out docs/downloads.json \
            --views-out docs/views.json

      - name: 提交（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json docs/views.json
          if git diff --staged --quiet; then
            echo "数字没变，跳过提交"
          else
            git commit -m "chore: 更新下载数 / 浏览量徽章"
            git push
          fi
