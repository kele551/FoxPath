version: 2

updates:
  # Python 依赖（打包工具链 / 发版脚本；运行时主程序一般零依赖）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions 版本（CI / 发版流水线引用的 action）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
